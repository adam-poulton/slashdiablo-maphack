name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2
    - uses: actions/checkout@master
    - name: MSBuild
      run: |
        $sha = $env:GITHUB_SHA.substring(0,7)
        msbuild /t:BH:Rebuild /p:Configuration=Release /p:CustomDefinitions="SHA=$sha" BH.sln
    - name: Read version
      id: version
      run: |
        $line = Select-String -Path BH/Constants.h -Pattern '^#define VERSION "(.+)"' | Select-Object -First 1
        $number = $line.Matches[0].Groups[1].Value
        # The changelog and the archive name use the bare number; the release is
        # named the way the version reads in game, product name and all.
        "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=BH $number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        # The tag names the version it builds, so a tag pushed against a stale
        # Constants.h fails here rather than shipping an archive and a release
        # page that disagree with the tag.
        $tag = $env:GITHUB_REF_NAME
        if ($tag -ne "v$number") {
          throw "Tag $tag does not match VERSION $number in BH/Constants.h. Expected v$number."
        }

    - name: Build the release archive
      # One download holding everything a user needs: the DLL, the configs, the
      # buff icons and the installation page.
      run: |
        $staging = "dist/slashdiablo-maphack-${{ steps.version.outputs.number }}"
        New-Item -ItemType Directory -Path $staging -Force | Out-Null
        Copy-Item Release/BH.dll -Destination $staging
        Copy-Item Packaging/* -Destination $staging -Recurse
        Copy-Item docs/Installation.md -Destination $staging
        Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"

    - name: Build the release notes
      # The changelog entry for this version, plus the installation page. The
      # commit log describes how the code changed, which is not what someone
      # downloading a build needs to read.
      run: |
        $number = "${{ steps.version.outputs.number }}"
        $changelog = Get-Content CHANGELOG.md -Raw
        $heading = '^# Release Notes for ' + [regex]::Escape($number) + '\b'
        $section = [regex]::Match($changelog, "(?ms)$heading.*?(?=^# Release Notes for |\z)")
        if (-not $section.Success) {
          throw "CHANGELOG.md has no 'Release Notes for $number' section. Add one before tagging."
        }
        # Everything below the heading line, which the release title already says.
        $notes = (($section.Value -split "`n", 2)[1]).Trim()
        # The changelog links to files by repository-relative path, which only
        # resolves while the page is being viewed in the repository. Point them
        # at the tagged commit so they still work from the release page.
        $blob = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME/"
        $notes = $notes -replace '\]\((?!https?://|#)([^)]+)\)', "]($blob`$1)"
        # Skip the page's own title and its underline; it becomes a section here.
        $install = ((Get-Content docs/Installation.md | Select-Object -Skip 2) -join "`n").Trim()
        $body = @('## Release Notes', '', $notes, '', '## Installation', '', $install) -join "`n"
        $body | Out-File -FilePath release-notes.md -Encoding utf8

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.version.outputs.version }}
        body_path: release-notes.md
        files: dist/slashdiablo-maphack-${{ steps.version.outputs.number }}.zip

  # Publish docs/ to the wiki, but only once the release itself has succeeded,
  # so a failed build never puts documentation live for a release that does not
  # exist. No-ops when docs/ has not changed since the last publish.
  publish-wiki:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-wiki.yaml

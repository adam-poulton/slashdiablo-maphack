name: Pull Request Builder

on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2
    - uses: actions/checkout@master
    # Tests build and run before the DLL: they are far cheaper than a full
    # rebuild, so a logic regression reports without waiting for one.
    - name: Build tests
      run: msbuild /t:BHTests:Rebuild /p:Configuration=Release BH.sln
    - name: Run tests
      run: .\Tests\Release\BHTests.exe
    - name: MSBuild
      run: |
        $sha = $env:GITHUB_SHA.substring(0,7)
        msbuild /t:BH:Rebuild /p:Configuration=Release /p:CustomDefinitions="SHA=$sha" BH.sln
    - uses: actions/upload-artifact@v4
      with:
        name: BH.dll
        path: Release/BH.dll
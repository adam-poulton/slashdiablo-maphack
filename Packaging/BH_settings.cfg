// Ordered Item Filtering
// False (the default): an ItemDisplay line in BH.cfg that hides an item (blank label) only takes
//   effect when no other line in that file gives the item a label or a map marker, no matter which
//   line comes first. So a broad hide line such as `ItemDisplay[FILTLVL=3 RARE BELT]:` never hides
//   a belt that some other line singles out by name.
// True: the earlier line wins, matching how the rest of BH.cfg is read. This lets a single catch-all
//   near the top of the file hide a whole category, instead of adding FILTLVL conditions to every
//   line that could show it.
// WARNING: with True, a hide line suppresses EVERY matching line below it, silently. A bare
//   `ItemDisplay[]:` near the top hides every item in the game and your config will look broken.
//   Put exceptions ABOVE their hide line, and fallbacks at the bottom of the file. Review any
//   config not written with ordering in mind before enabling this.
//   See docs/Advanced-Item-Display.md for details.
Ordered Item Filtering: False

